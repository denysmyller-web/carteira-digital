<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carteira Digital</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#16324f;font:16px system-ui,sans-serif}main{max-width:940px;margin:50px auto;padding:24px}h1{font-size:36px;margin:10px 0}header p{color:#52667b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}section{background:white;padding:24px;border-radius:14px;border:1px solid #dbe4ed}h2{font-size:21px}label{display:block;margin:14px 0 6px}input,button{font:inherit;width:100%;padding:11px;border-radius:7px;border:1px solid #aabacc}button{background:#155e75;color:white;border:0;margin-top:18px;cursor:pointer}output{display:block;margin-top:15px;overflow-wrap:anywhere}.erro{color:#b42318}.sucesso{color:#116548}footer{margin-top:22px;font-size:13px;color:#52667b}
</style></head>
<body><main><header><p>PROJETO • TESTES AUTOMATIZADOS I</p><h1>Carteira Digital</h1><p>Crie uma conta, consulte o saldo e experimente as operações.</p></header>
<div class="grid">
<section><h2>Abrir conta</h2><form id="criar-form"><label for="titular">Titular</label><input id="titular" required maxlength="255"><button>Criar conta</button></form><output id="conta-criada" aria-live="polite"></output></section>
<section><h2>Depósito e saldo</h2><form id="deposito-form"><label for="contaId">Número da conta</label><input id="contaId" type="number" min="1" step="1" required><label for="valor">Valor do depósito (R$)</label><input id="valor" type="number" min="0.01" step="0.01" required><button id="depositar">Depositar</button></form><button type="button" id="consultar">Consultar saldo</button><output id="resultado" aria-live="polite"></output></section>
<section><h2>Transferência</h2><form id="transferencia-form"><label for="origem">Conta de origem</label><input id="origem" type="number" min="1" required><label for="destino">Conta de destino</label><input id="destino" type="number" min="1" required><label for="transferencia-valor">Valor (R$)</label><input id="transferencia-valor" type="number" min="0.01" step="0.01" required><button>Transferir</button></form><output id="transferencia-resultado" aria-live="polite"></output></section>
</div><footer>Ambiente didático com banco H2 em memória. Os dados são apagados ao encerrar a aplicação.</footer></main>
<script>
const campo = id => document.getElementById(id);
const moeda = valor => valor.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
async function api(url, dados) {
 const resposta = await fetch(url, dados === undefined ? {} : {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(dados)});
 const corpo = await resposta.json();
 if(!resposta.ok) throw new Error(corpo.mensagem || 'Não foi possível concluir a operação.');
 return corpo;
}
async function mostrar(id, acao){ const saida=campo(id);try{saida.textContent=await acao();saida.className='sucesso';}catch(erro){saida.textContent=erro.message;saida.className='erro';} }
campo('criar-form').addEventListener('submit',evento=>{evento.preventDefault();mostrar('conta-criada',async()=>{const conta=await api('/api/contas',{titular:campo('titular').value});campo('contaId').value=conta.id;return `Conta ${conta.id} criada para ${conta.titular}. Saldo: ${moeda(conta.saldo)}`;});});
campo('deposito-form').addEventListener('submit',evento=>{evento.preventDefault();mostrar('resultado',async()=>{const conta=await api(`/api/contas/${campo('contaId').value}/depositos`,{valor:Number(campo('valor').value)});return `Depósito realizado. Saldo: ${moeda(conta.saldo)}`;});});
campo('consultar').addEventListener('click',()=>{if(!campo('contaId').reportValidity())return;mostrar('resultado',async()=>{const resposta=await api(`/api/contas/${campo('contaId').value}/saldo`);return `Saldo: ${moeda(resposta.saldo)}`;});});
campo('transferencia-form').addEventListener('submit',evento=>{evento.preventDefault();mostrar('transferencia-resultado',async()=>{const resposta=await api('/api/transferencias',{origemId:Number(campo('origem').value),destinoId:Number(campo('destino').value),valor:Number(campo('transferencia-valor').value)});return resposta.mensagem;});});
</script></body></html>
